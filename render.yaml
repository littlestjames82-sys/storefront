# Render Blueprint — Storefront (free tier)
# Fixed 2026-10-06 (proactive prep for the Netlify-credits move, NOT deployed):
# the previous version generated a NEW ADMIN_TOKEN and had no Turso slots at
# all — a blueprint deploy would have booted on the ephemeral local-file DB
# in /tmp, seeded demo data, and silently disconnected from the production
# Turso database. All secrets below are sync:false — Render prompts for them
# at deploy time; nothing is committed. Paste the EXISTING values from the
# Netlify site env (admin token + Turso URL/token), do not invent new ones.
services:
  - type: web
    name: storefront
    runtime: node
    plan: free
    buildCommand: "node --version"
    startCommand: "node server.js"
    envVars:
      - key: ADMIN_TOKEN
        sync: false # paste the existing token from Netlify env — do NOT generate a new one
      - key: TURSO_DATABASE_URL
        sync: false # production DB ("storefront") — without this + token, db.js falls back to a local file
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DATA_DIR
        value: /tmp/storefront-data # fallback only, used if Turso vars are missing; /tmp is ephemeral on Render free
      # Optional — fill in at deploy if these are set in Netlify, to enable real SMS / outbound webhooks:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: OUTBOUND_WEBHOOK_URL
        sync: false
